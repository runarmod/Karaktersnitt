name: Create release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'runarmod/Karaktersnitt'
    name: Create new GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: ⚙️ Install web-ext
        run: npm install -g web-ext

      - name: 🏗️ Build the extension
        run: |
          web-ext build
          cp web-ext-artifacts/*.zip latest.zip

      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-ext-artifacts
          path: latest.zip

      - name: 🚀 Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.TOKEN }}
          generate_release_notes: true
          make_latest: true
          files: web-ext-artifacts/*.zip

  publish-firefox:
    # prevents this action from running on forks
    if: github.repository == 'runarmod/Karaktersnitt'
    name: Update listing on Firefox
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download artifact
        uses: actions/download-artifact@v8
        with:
          name: web-ext-artifacts
          path: web-ext-artifacts

      - name: 🚀 Publish to Firefox
        uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: "{ed445e9e-ee55-4a38-9692-83a6012845d0}"
          xpi-path: web-ext-artifacts/latest.zip
          jwt-issuer: ${{ secrets.FIREFOX_API_KEY }}
          jwt-secret: ${{ secrets.FIREFOX_API_SECRET }}

  publish-chrome:
    # prevents this action from running on forks
    if: github.repository == 'runarmod/Karaktersnitt'
    name: Update listing on Chrome
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download artifact
        uses: actions/download-artifact@v8
        with:
          name: web-ext-artifacts
          path: web-ext-artifacts

      - name: 🚀 Publish to Chrome
        uses: wdzeng/chrome-extension@v2
        with:
          extension-id: cnfbclbahglengpahopaafpoffahojhd
          zip-path: web-ext-artifacts/latest.zip
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-edge:
    # prevents this action from running on forks
    if: github.repository == 'runarmod/Karaktersnitt'
    name: Update listing on Edge
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download artifact
        uses: actions/download-artifact@v8
        with:
          name: web-ext-artifacts
          path: web-ext-artifacts

      - name: 🚀 Publish to Edge
        uses: wdzeng/edge-addon@v2
        with:
          product-id: c8bdd961-90a7-4635-88a7-8199e6224414
          zip-path: web-ext-artifacts/latest.zip
          api-key: ${{ secrets.EDGE_API_KEY }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
